			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\nAPP=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}\"\nRES=\"$APP/Resources\"\nmkdir -p \"$RES\"\ncd \"$SRCROOT\"\n\n# --- app icon, menu bar glyph and brand mark (Tools/MakeIcon.swift) ---\nICONDIR=\"${DERIVED_FILE_DIR}/icons\"\nrm -rf \"$ICONDIR\"; mkdir -p \"$ICONDIR\"\nxcrun swift Tools/MakeIcon.swift \"$ICONDIR/AppIcon.iconset\" >/dev/null\ncp \"$ICONDIR/AppIcon.icns\" \"$RES/AppIcon.icns\"\ncp \"$ICONDIR/MenuBarIcon.png\" \"$ICONDIR/MenuBarIcon@2x.png\" \"$ICONDIR/BrandMark.png\" \"$RES/\"\n\n# --- adaptive icon catalog (Assets.car); Dock falls back to the .icns ---\nACTOOL=\"$(xcrun --find actool 2>/dev/null || true)\"\nif [ -n \"$ACTOOL\" ] && [ -d \"$SRCROOT/Resources/Brand/AppIcon.icon\" ]; then\n    T=\"${DERIVED_FILE_DIR}/iconcatalog\"\n    rm -rf \"$T\"; mkdir -p \"$T/catalog\"\n    ditto \"$SRCROOT/Resources/Brand/AppIcon.icon\" \"$T/AppIcon.icon\"\n    if \"$ACTOOL\" \"$T/AppIcon.icon\" --compile \"$T/catalog\" --app-icon AppIcon \\\n        --platform macosx --target-device mac --minimum-deployment-target 14.0 \\\n        --enable-on-demand-resources NO \\\n        --output-partial-info-plist \"$T/partial.plist\" >\"$T/actool.log\" 2>&1 \\\n        && [ -s \"$T/catalog/Assets.car\" ]; then\n        cp \"$T/catalog/Assets.car\" \"$RES/Assets.car\"\n    else\n        echo \"warning: adaptive icon catalog skipped (Dock uses AppIcon.icns)\"\n    fi\nfi\n\n# --- stamp the fan helper fingerprint the app checks at runtime ---\nPLIST=\"$APP/Info.plist\"\nHELPER=\"$APP/Library/LaunchServices/com.sundry.utils.fan-control\"\nDPLIST=\"$APP/Library/LaunchDaemons/com.sundry.utils.fan-control.plist\"\nif [ -f \"$HELPER\" ] && [ -f \"$DPLIST\" ]; then\n    V=\"$(LC_ALL=C /usr/bin/shasum -a 256 \"$HELPER\" \"$DPLIST\" \\\n        | /usr/bin/awk '{print $1}' | /usr/bin/shasum -a 256 | /usr/bin/awk '{print $1}')\"\n    /usr/libexec/PlistBuddy -c \"Delete :SundryFanControlHelperVersion\" \"$PLIST\" 2>/dev/null || true\n    /usr/libexec/PlistBuddy -c \"Add :SundryFanControlHelperVersion string $V\" \"$PLIST\"\nfi\nprintf 'APPL????' > \"$APP/PkgInfo\"\n";
		};
